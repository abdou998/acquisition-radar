name: Daily Acquisition Radar

on:
  schedule:
    # Runs every day at 08:00 UTC (08:00 Africa/Casablanca)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

permissions:
  contents: write # Needed to commit updated database and reports

jobs:
  run-acquisition-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Acquisition Radar Discovery & Dispatch Email
        env:
          RADAR_MAX_NORMAL_BUDGET: ${{ vars.RADAR_MAX_NORMAL_BUDGET || '1000.0' }}
          RADAR_MAX_EXCEPTIONAL_BUDGET: ${{ vars.RADAR_MAX_EXCEPTIONAL_BUDGET || '5000.0' }}
          RADAR_TIMEZONE: ${{ vars.RADAR_TIMEZONE || 'Africa/Casablanca' }}
          RADAR_ENABLE_EMAIL: ${{ secrets.RADAR_ENABLE_EMAIL || 'true' }}
          RADAR_SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          RADAR_SMTP_PORT: ${{ secrets.RADAR_SMTP_PORT || '587' }}
          RADAR_SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          RADAR_SMTP_SENDER: ${{ secrets.RADAR_SMTP_SENDER }}
          RADAR_EMAIL_RECIPIENT: ${{ secrets.RADAR_EMAIL_RECIPIENT }}
          RADAR_ENABLE_TELEGRAM: ${{ secrets.RADAR_ENABLE_TELEGRAM || 'false' }}
          RADAR_TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_TELEGRAM_BOT_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
          FLIPPA_API_KEY: ${{ secrets.FLIPPA_API_KEY }}
          ACQUIRE_API_KEY: ${{ secrets.ACQUIRE_API_KEY }}
        run: |
          python main.py run

      - name: Upload Daily Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-acquisition-reports
          path: reports/
          retention-days: 30

      - name: Commit updated database and history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily acquisition radar run [skip ci]" && git push)
